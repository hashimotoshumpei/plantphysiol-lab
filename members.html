<style>
/* 教員・学生共通の2列レイアウト */
.member-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 30px;
  margin: 25px 0 40px;
}

/* 個人ごとの配置 */
.member-card {
  display: flex;
  align-items: flex-start;
  gap: 20px;
}

/* 写真 */
.member-photo {
  width: 160px;
  height: 160px;
  object-fit: cover;
  border-radius: 50%;
  flex-shrink: 0;
}

/* 氏名・役職・研究分野 */
.member-info {
  flex: 1;
  min-width: 0;
}

.member-info h4 {
  margin: 0 0 12px;
  font-size: 20px;
}

.member-info p {
  margin: 0 0 12px;
  font-size: 16px;
  line-height: 1.6;
}

/* スマートフォンでは1列 */
@media (max-width: 700px) {
  .member-grid {
    grid-template-columns: 1fr;
  }

  .member-photo {
    width: 120px;
    height: 120px;
  }
}
</style>
